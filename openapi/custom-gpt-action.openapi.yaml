                  "$ref": "#/components/schemas/TerminalIntegrityError"
                }
              }
            }
          }
        }
      },
      "parameters": [
        {
          "name": "session_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "pattern": "^s_[0-9a-f]{32}$"
          }
        }
      ]
    },
    "/v1/sessions/{session_id}/next-contract": {
      "get": {
        "operationId": "getNextPhaseContract",
        "description": "Return only the current Phase branch; generate exactly one Phase per response.",
        "responses": {
