{
  "openapi": "3.1.0",
  "info": {
    "title": "Theme Candidate Comparison Private Runtime",
    "version": "1.2.0",
    "description": "Custom GPT researches one Phase; runtime validates and persists."
  },
  "servers": [
    {
      "url": "https://runtime.example.com"
    }
  ],
  "security": [
    {
      "BearerAuth": []
    }
  ],
  "paths": {
    "/health": {
      "get": {
        "operationId": "getRuntimeHealth",
        "security": [],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthResponse"
                }
              }
            }
          },
          "503": {
            "description": "Storage unhealthy",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthResponse"
                }
              }
            }
          }
        }
      }
    },
    "/v1/sessions": {
      "post": {
        "operationId": "createComparisonSession",
        "description": "Create exactly one session from the authoritative upstream handoff; execute no Phase.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateSessionRequest"
              },
              "example": {
                "schema_version": "1.0.0",
                "theme": "AI",
                "hypothesis": "growth",
                "comparison_as_of": "2026-01-01T00:00:00Z",
                "source_cutoff_at": "2025-12-31T00:00:00Z",
                "candidate_inputs": [
                  {
                    "candidate_id": "US-XNAS-AAA-common",
                    "issuer_id": "issuer-AAA",
                    "issuer_name": "AAA",
                    "ticker": "AAA",
                    "exchange": "XNAS",
                    "share_class": "common",
                    "is_adr": false,
                    "underlying_security_id": null,
                    "former_tickers": [],
                    "corporate_action_lineage": [],
                    "listing_country": "US"
                  }
                ],
                "source_generation_id": "source-g1",
                "source_session_id": "source-s1",
                "evidence_refs": []
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CreateSessionResponse"
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized"
          },
          "422": {
            "description": "Retryable validation failure",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ValidationError"
                }
              }
            }
          },
          "500": {
            "description": "Terminal integrity failure",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TerminalIntegrityError"
                }
              }
            }
          }
        }
      }
    },
    "/v1/sessions/{session_id}": {
      "get": {
        "operationId": "getComparisonSession",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SessionSummary"
