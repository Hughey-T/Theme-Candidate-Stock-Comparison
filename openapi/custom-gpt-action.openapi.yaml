  "components": {
    "securitySchemes": {
      "BearerAuth": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "CreateSessionRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "schema_version": {
            "const": "1.0.0"
          },
          "theme": {
            "type": "string",
            "minLength": 1
          },
          "hypothesis": {
            "type": "string",
            "minLength": 1
          },
          "comparison_as_of": {
            "type": "string",
            "format": "date-time",
            "pattern": "(Z|[+-]\\d\\d:\\d\\d)$"
          },
          "source_cutoff_at": {
            "type": "string",
            "format": "date-time",
            "pattern": "(Z|[+-]\\d\\d:\\d\\d)$"
          },
          "candidate_inputs": {
            "type": "array",
            "minItems": 1,
            "maxItems": 12,
            "uniqueItems": true,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "candidate_id": {
                  "type": "string",
                  "minLength": 1
                },
                "issuer_id": {
                  "type": "string",
                  "minLength": 1
                },
                "issuer_name": {
                  "type": "string",
                  "minLength": 1
                },
                "ticker": {
                  "type": "string",
                  "minLength": 1
                },
                "exchange": {
                  "type": "string",
                  "minLength": 1
                },
                "share_class": {
                  "type": "string",
                  "minLength": 1
                },
                "is_adr": {
                  "type": "boolean"
                },
                "underlying_security_id": {
                  "type": [
                    "string",
                    "null"
                  ]
                },
                "former_tickers": {
                  "type": "array",
                  "items": {
                    "type": "string",
                    "minLength": 1
                  },
                  "uniqueItems": true
                },
                "corporate_action_lineage": {
                  "type": "array",
                  "items": {
                    "type": "string",
                    "minLength": 1
                  },
                  "uniqueItems": true
                },
                "listing_country": {
                  "type": "string",
                  "minLength": 1
                }
              },
              "required": [
                "candidate_id",
                "issuer_id",
                "issuer_name",
                "ticker",
                "exchange",
                "share_class",
                "is_adr",
                "underlying_security_id",
                "former_tickers",
                "corporate_action_lineage",
                "listing_country"
              ],
              "$schema": "https://json-schema.org/draft/2020-12/schema"
            }
          },
          "source_generation_id": {
            "type": "string",
            "minLength": 1
          },
          "source_session_id": {
            "type": "string",
            "minLength": 1
          },
          "evidence_refs": {
            "type": "array",
            "items": {
              "type": "string",
              "minLength": 1
            },
            "uniqueItems": true
          }
        },
        "required": [
          "schema_version",
          "theme",
          "hypothesis",
          "comparison_as_of",
          "source_cutoff_at",
          "candidate_inputs",
          "source_generation_id",
          "source_session_id",
          "evidence_refs"
        ],
        "$schema": "https://json-schema.org/draft/2020-12/schema"
      },
      "PhaseArtifact": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "oneOf": [
          {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "mode": {
                "const": "initial"
              },
              "phase": {
                "const": 1
              },
              "generation_id": {
                "type": "string",
                "minLength": 1
              },
              "candidate_set_id": {
                "type": "string",
                "minLength": 1
              },
              "source_cutoff_at": {
                "type": "string",
                "format": "date-time",
                "pattern": "(Z|[+-]\\d\\d:\\d\\d)$"
              },
              "facts": {
                "type": "array",
                "items": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "evidence_id": {
                      "type": "string",
                      "minLength": 1
                    },
                    "candidate_id": {
                      "type": [
                        "string",
                        "null"
                      ]
                    },
                    "statement": {
                      "type": "string",
                      "minLength": 1
                    },
                    "as_of": {
                      "type": "string",
                      "format": "date-time",
                      "pattern": "(Z|[+-]\\d\\d:\\d\\d)$"
                    },
                    "source_type": {
                      "const": "FACT"
                    }
                  },
                  "required": [
                    "evidence_id",
                    "candidate_id",
                    "statement",
                    "as_of",
                    "source_type"
                  ]
                }
              },
              "company_claims": {
                "type": "array",
                "items": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "evidence_id": {
                      "type": "string",
                      "minLength": 1
                    },
                    "candidate_id": {
                      "type": [
                        "string",
                        "null"
                      ]
                    },
                    "statement": {
                      "type": "string",
                      "minLength": 1
                    },
                    "as_of": {
                      "type": "string",
                      "format": "date-time",
                      "pattern": "(Z|[+-]\\d\\d:\\d\\d)$"
                    },
                    "source_type": {
                      "const": "COMPANY_CLAIM"
                    }
                  },
                  "required": [
                    "evidence_id",
                    "candidate_id",
                    "statement",
                    "as_of",
                    "source_type"
                  ]
                }
              },
              "external_estimates": {
                "type": "array",
                "items": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "evidence_id": {
                      "type": "string",
                      "minLength": 1
                    },
                    "candidate_id": {
                      "type": [
                        "string",
                        "null"
                      ]
                    },
                    "statement": {
                      "type": "string",
                      "minLength": 1
                    },
                    "as_of": {
                      "type": "string",
                      "format": "date-time",
                      "pattern": "(Z|[+-]\\d\\d:\\d\\d)$"
                    },
                    "source_type": {
                      "const": "EXTERNAL_ESTIMATE"
                    }
                  },
                  "required": [
                    "evidence_id",
                    "candidate_id",
                    "statement",
                    "as_of",
                    "source_type"
                  ]
                }
              },
              "judgments": {
                "type": "array",
                "items": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "judgment": {
                      "type": "string",
                      "minLength": 1
                    },
                    "evidence_refs": {
                      "type": "array",
                      "items": {
                        "type": "string",
                        "minLength": 1
                      },
                      "minItems": 1,
                      "uniqueItems": true
                    },
                    "contrary_evidence_refs": {
                      "type": "array",
                      "items": {
                        "type": "string",
                        "minLength": 1
                      },
                      "minItems": 1,
                      "uniqueItems": true
                    },
                    "confidence": {
                      "enum": [
                        "low",
                        "medium",
                        "high"
                      ]
                    },
                    "assumptions": {
                      "type": "array",
                      "items": {
                        "type": "string",
                        "minLength": 1
                      }
                    },
                    "invalidation_conditions": {
                      "type": "array",
                      "items": {
                        "type": "string",
                        "minLength": 1
                      },
                      "minItems": 1
                    }
                  },
                  "required": [
                    "judgment",
                    "evidence_refs",
                    "contrary_evidence_refs",
                    "confidence",
                    "assumptions",
                    "invalidation_conditions"
                  ]
                }
              },
              "payload": {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "session_and_candidates": {
                    "type": "object",
                    "additionalProperties": false,
                    "properties": {
                      "theme": {
                        "type": "string",
                        "minLength": 1
                      },
                      "hypothesis": {
                        "type": "string",
                        "minLength": 1
                      },
                      "comparison_as_of": {
                        "type": "string",
                        "format": "date-time",
                        "pattern": "(Z|[+-]\\d\\d:\\d\\d)$"
                      },
                      "source_cutoff_at": {
                        "type": "string",
                        "format": "date-time",
                        "pattern": "(Z|[+-]\\d\\d:\\d\\d)$"
                      },
                      "candidate_inputs": {
                        "type": "array",
                        "items": {
                          "type": "object",
                          "additionalProperties": false,
                          "properties": {
                            "candidate_id": {
                              "type": "string",
                              "minLength": 1
                            },
                            "issuer_id": {
                              "type": "string",
                              "minLength": 1
                            },
                            "issuer_name": {
                              "type": "string",
                              "minLength": 1
                            },
                            "ticker": {
                              "type": "string",
                              "minLength": 1
                            },
                            "exchange": {
                              "type": "string",
                              "minLength": 1
                            },
                            "share_class": {
                              "type": "string",
                              "minLength": 1
                            },
                            "is_adr": {
                              "type": "boolean"
                            },
                            "underlying_security_id": {
                              "type": [
                                "string",
                                "null"
                              ]
                            },
                            "former_tickers": {
                              "type": "array",
                              "items": {
                                "type": "string",
                                "minLength": 1
                              },
                              "uniqueItems": true
                            },
                            "corporate_action_lineage": {
                              "type": "array",
                              "items": {
                                "type": "string",
                                "minLength": 1
                              },
                              "uniqueItems": true
                            },
                            "listing_country": {
                              "type": "string",
                              "minLength": 1
                            }
                          },
                          "required": [
                            "candidate_id",
                            "issuer_id",
                            "issuer_name",
                            "ticker",
                            "exchange",
                            "share_class",
                            "is_adr",
                            "underlying_security_id",
                            "former_tickers",
                            "corporate_action_lineage",
                            "listing_country"
