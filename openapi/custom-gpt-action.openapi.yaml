      "get": {
        "operationId": "getActiveComparisonHandoff",
        "parameters": [
          {
            "name": "include_history",
            "in": "query",
            "schema": {
              "type": "boolean",
              "default": false
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ActiveHandoffResponse"
