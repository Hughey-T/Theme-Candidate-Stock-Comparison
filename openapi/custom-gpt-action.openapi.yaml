          }
        }
      ]
    },
    "/v1/sessions/{session_id}/updates": {
      "post": {
        "operationId": "startComparisonUpdate",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/StartUpdateRequest"
