name: Format Phase 10

on:
  push:
    branches:
      - fix/phase10-ranking-contract

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase10-ranking-contract
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ruff==0.15.12
      - run: ruff format src/theme_compare/ranking.py tests/test_phase10_contract.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/theme_compare/ranking.py tests/test_phase10_contract.py
          git commit -m "Apply Ruff formatting to Phase 10 changes"
          git push origin HEAD:fix/phase10-ranking-contract
