name: PowerShell
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse production PowerShell scripts
        shell: powershell
        run: |
          $files = @(
            'deploy/setup-ngrok.ps1',
            'deploy/verify-production.ps1',
            'deploy/finalize-production.ps1',
            'deploy/copy-custom-gpt-instructions.ps1',
            'deploy/diagnose-live-action.ps1',
            'deploy/diagnose-ngrok-action-response.ps1',
            'deploy/refresh-custom-gpt-production.ps1',
            'deploy/prepare-custom-gpt-action-diagnostic.ps1',
            'deploy/prepare-custom-gpt-full-schema-diagnostic.ps1',
            'deploy/diagnose-custom-gpt-action-probe.ps1',
            'deploy/diagnose-latest-v2-progress.ps1',
            'deploy/diagnose-latest-v2-server-error.ps1'
          )
          foreach ($file in $files) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$null,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-Host
              throw "PowerShell parse failed: $file"
            }
          }
      - name: Verify UTF-8 Custom GPT instructions
        shell: powershell
        run: .\deploy\copy-custom-gpt-instructions.ps1 -ValidateOnly
