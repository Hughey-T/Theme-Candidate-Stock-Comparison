name: Format artifact
on:
  push:
    branches: [fix/production-runtime-hardening]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install ruff==0.15.12
      - run: ruff format src/theme_compare/action_openapi.py src/theme_compare/api.py tests/test_openapi.py
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-formatted
          path: |
            src/theme_compare/action_openapi.py
            src/theme_compare/api.py
            tests/test_openapi.py
