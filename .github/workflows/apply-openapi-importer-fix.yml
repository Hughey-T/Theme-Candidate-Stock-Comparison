name: Apply OpenAPI importer fix

on:
  push:
    branches:
      - fix/custom-gpt-actions-openapi-importer

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Update canonical Schema generator
        shell: python
        run: |
          from pathlib import Path

          path = Path("tools/generate_schemas.py")
          text = path.read_text(encoding="utf-8")
          old = '    artifact = {"$schema": "https://json-schema.org/draft/2020-12/schema", "oneOf": variants}\n'
          new = (
              '    artifact = {\n'
              '        "$schema": "https://json-schema.org/draft/2020-12/schema",\n'
              '        "type": "object",\n'
              '        "oneOf": variants,\n'
              '    }\n'
          )
          if text.count(old) != 1:
              raise SystemExit("Expected PhaseArtifact generator assignment was not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")

      - name: Add deterministic OpenAPI generator
        shell: bash
        run: |
          cat > tools/generate_openapi.py <<'PY'
          """Generate the Custom GPT Actions document from packaged contracts."""

          from __future__ import annotations

          import json
          from copy import deepcopy
          from pathlib import Path
          from typing import Any

          ROOT = Path(__file__).parents[1]
          OPENAPI_PATH = ROOT / "openapi" / "custom-gpt-action.openapi.yaml"
          SCHEMA_ROOT = ROOT / "src" / "theme_compare" / "schemas"
          HTTP_METHODS = {"get", "post", "put", "patch", "delete", "options", "head", "trace"}


          def load_json(path: Path) -> dict[str, Any]:
              return json.loads(path.read_text(encoding="utf-8"))


          def parameter_key(parameter: dict[str, Any]) -> tuple[Any, Any]:
              return parameter.get("name"), parameter.get("in")


          def move_path_parameters_to_operations(document: dict[str, Any]) -> None:
              for path, path_item in document["paths"].items():
                  inherited = path_item.pop("parameters", [])
                  operations = [
                      operation
                      for method, operation in path_item.items()
                      if method in HTTP_METHODS
                  ]
                  for operation in operations:
                      existing = operation.get("parameters", [])
                      merged: list[dict[str, Any]] = []
                      seen: set[tuple[Any, Any]] = set()
                      for parameter in [*inherited, *existing]:
                          key = parameter_key(parameter)
                          if key in seen:
                              continue
                          seen.add(key)
                          merged.append(deepcopy(parameter))
                      if "{session_id}" in path:
                          session_parameters = [
                              parameter
                              for parameter in merged
                              if parameter_key(parameter) == ("session_id", "path")
                          ]
                          if len(session_parameters) != 1:
                              raise ValueError(
                                  f"{path} must define exactly one session_id path parameter"
                              )
                          session_parameter = session_parameters[0]
                          merged = [
                              parameter
                              for parameter in merged
                              if parameter_key(parameter) != ("session_id", "path")
                          ]
                          merged.insert(0, session_parameter)
                      if merged:
                          operation["parameters"] = merged
                      else:
                          operation.pop("parameters", None)


          def main() -> None:
              document = load_json(OPENAPI_PATH)
              components = document["components"]["schemas"]
              components["CreateSessionRequest"] = load_json(
                  SCHEMA_ROOT / "upstream-theme-handoff.schema.json"
              )
              components["PhaseArtifact"] = load_json(
                  SCHEMA_ROOT / "phase-artifact.schema.json"
              )
              move_path_parameters_to_operations(document)
              OPENAPI_PATH.write_text(
                  json.dumps(document, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )


          if __name__ == "__main__":
              main()
          PY

      - name: Replace OpenAPI importer regression tests
        shell: bash
        run: |
          cat > tests/test_openapi.py <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          import sys
          from pathlib import Path

          from jsonschema import Draft202012Validator

          from theme_compare.api import create_app
          from theme_compare.storage import JsonVolumeStorage

          OPENAPI_PATH = Path("openapi/custom-gpt-action.openapi.yaml")
          DOC = json.loads(OPENAPI_PATH.read_text(encoding="utf-8"))
          HTTP_METHODS = {"get", "post", "put", "patch", "delete"}
          EXPECTED_OPERATION_IDS = {
              "getRuntimeHealth",
              "createComparisonSession",
              "getComparisonSession",
              "getNextPhaseContract",
              "submitComparisonPhase",
              "startComparisonUpdate",
              "getActiveComparisonHandoff",
          }
          SESSION_OPERATIONS = {
              ("/v1/sessions/{session_id}", "get"),
              ("/v1/sessions/{session_id}/next-contract", "get"),
              ("/v1/sessions/{session_id}/phases", "post"),
              ("/v1/sessions/{session_id}/updates", "post"),
              ("/v1/sessions/{session_id}/handoff", "get"),
          }


          def operations():
              for path, item in DOC["paths"].items():
                  for method, operation in item.items():
                      if method in HTTP_METHODS:
                          yield path, method, operation


          def resolve(schema):
              if "$ref" not in schema:
                  return schema
              return DOC["components"]["schemas"][schema["$ref"].rsplit("/", 1)[1]]


          def test_openapi_31_unique_operations_and_no_placeholder():
              assert DOC["openapi"] == "3.1.0"
              ids = [operation["operationId"] for _, _, operation in operations()]
              assert set(ids) == EXPECTED_OPERATION_IDS
              assert len(ids) == len(set(ids)) == 7
              assert all("YOUR_" not in server["url"] for server in DOC["servers"])


          def test_route_method_and_auth_alignment(tmp_path):
              app = create_app(JsonVolumeStorage(tmp_path), "x")
              actual = {
                  (route.path, next(iter(route.methods)).lower())
                  for route in app.routes
                  if getattr(route, "methods", None)
              }
              declared = {(path, method) for path, method, _ in operations()}
              assert declared <= actual
              for path, _, operation in operations():
                  assert operation.get("security", DOC.get("security")) == (
                      [] if path == "/health" else [{"BearerAuth": []}]
                  )


          def test_named_request_response_contracts_are_closed():
              required = {
                  "CreateSessionRequest",
                  "CreateSessionResponse",
                  "SessionSummary",
                  "NextPhaseContract",
                  "PhaseArtifact",
                  "PhaseAcceptedResponse",
                  "StartUpdateRequest",
                  "StartUpdateResponse",
                  "ActiveHandoffResponse",
                  "ValidationError",
                  "TerminalIntegrityError",
                  "HealthResponse",
              }
              assert required <= DOC["components"]["schemas"].keys()
              for name in required:
                  schema = DOC["components"]["schemas"][name]
                  if schema.get("type") == "object" and "oneOf" not in schema:
                      assert schema.get("additionalProperties") is False
                      assert schema.get("required")
                  Draft202012Validator.check_schema(schema)


          def test_create_request_is_packaged_upstream_contract():
              packaged = json.loads(
                  Path("src/theme_compare/schemas/upstream-theme-handoff.schema.json").read_text(
                      encoding="utf-8"
                  )
              )
              assert DOC["components"]["schemas"]["CreateSessionRequest"] == packaged


          def test_phase_artifact_is_packaged_object_contract():
              packaged = json.loads(
                  Path("src/theme_compare/schemas/phase-artifact.schema.json").read_text(
                      encoding="utf-8"
                  )
              )
              schema = DOC["components"]["schemas"]["PhaseArtifact"]
              assert schema == packaged
              assert schema["type"] == "object"
              assert len(schema["oneOf"]) == 12


          def test_path_item_parameters_are_not_used():
              for path_item in DOC["paths"].values():
                  assert "parameters" not in path_item


          def test_session_id_is_required_at_operation_level():
              for path, method in SESSION_OPERATIONS:
                  parameters = DOC["paths"][path][method].get("parameters", [])
                  matches = [
                      parameter
                      for parameter in parameters
                      if (parameter.get("name"), parameter.get("in"))
                      == ("session_id", "path")
                  ]
                  assert len(matches) == 1
                  assert matches[0]["required"] is True
                  assert parameters[0] == matches[0]


          def test_handoff_keeps_session_id_and_include_history():
              parameters = DOC["paths"]["/v1/sessions/{session_id}/handoff"]["get"][
                  "parameters"
              ]
              assert [(parameter["name"], parameter["in"]) for parameter in parameters] == [
                  ("session_id", "path"),
                  ("include_history", "query"),
              ]


          def test_submit_phase_request_resolves_to_object_schema():
              schema = DOC["paths"]["/v1/sessions/{session_id}/phases"]["post"][
                  "requestBody"
              ]["content"]["application/json"]["schema"]
              resolved = resolve(schema)
              assert resolved["type"] == "object"
              assert len(resolved["oneOf"]) == 12


          def test_openapi_generation_is_byte_stable():
              before = OPENAPI_PATH.read_bytes()
              subprocess.run(
                  [sys.executable, "tools/generate_openapi.py"],
                  check=True,
              )
              assert OPENAPI_PATH.read_bytes() == before
          PY

      - name: Regenerate packaged contracts and OpenAPI
        shell: bash
        run: |
          PYTHONPATH=src python tools/generate_schemas.py
          python tools/generate_openapi.py

      - name: Run importer contract check
        shell: python
        run: |
          import json
          from pathlib import Path

          document = json.loads(
              Path("openapi/custom-gpt-action.openapi.yaml").read_text(encoding="utf-8")
          )
          methods = {"get", "post", "put", "patch", "delete"}
          operations = [
              operation
              for item in document["paths"].values()
              for method, operation in item.items()
              if method in methods
          ]
          assert all("parameters" not in item for item in document["paths"].values())
          assert len({operation["operationId"] for operation in operations}) == 7
          phase = document["components"]["schemas"]["PhaseArtifact"]
          assert phase["type"] == "object"
          assert len(phase["oneOf"]) == 12

      - name: Remove bootstrap workflow and commit generated fix
        shell: bash
        run: |
          rm .github/workflows/apply-openapi-importer-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            openapi/custom-gpt-action.openapi.yaml \
            src/theme_compare/schemas/phase-artifact.schema.json \
            src/theme_compare/schemas/session-state.schema.json \
            tests/test_openapi.py \
            tools/generate_openapi.py \
            tools/generate_schemas.py \
            .github/workflows/apply-openapi-importer-fix.yml
          git commit -m "Make OpenAPI compatible with Custom GPT Actions"
          git push origin HEAD:fix/custom-gpt-actions-openapi-importer
