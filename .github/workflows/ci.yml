name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - run: PIP_CONSTRAINT=constraints-dev.txt python -m pip install -e '.[dev]'
      - run: pytest -q
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: PIP_CONSTRAINT=constraints-dev.txt python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - name: Schema samples and representative mutation suite
        run: pytest -q tests/test_schemas.py tests/test_samples.py tests/test_semantics.py tests/test_publication.py
  fresh-clone-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: clean}
      - run: python -m venv /tmp/theme-venv && cd clean && PIP_CONSTRAINT=constraints-dev.txt /tmp/theme-venv/bin/pip wheel '.[dev]' -w /tmp/wheels
      - run: PIP_CONSTRAINT=clean/constraints-dev.txt /tmp/theme-venv/bin/pip install /tmp/wheels/*.whl
      - name: Import wheel and packaged schemas outside checkout
        run: cd /tmp && /tmp/theme-venv/bin/python -c "from theme_compare.schema_runtime import schema_bytes; from theme_compare.state import StateMachine; assert b'oneOf' in schema_bytes('phase-artifact')"
      - run: cd clean && /tmp/theme-venv/bin/pytest -q tests/test_state.py tests/test_publication.py

  container-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t theme-compare:test .
      - name: Container health and persistent-volume restart E2E
        run: |
          docker volume create theme-compare-ci
          docker run -d --name runtime-1 -e THEME_COMPARE_API_KEY=ci-secret -v theme-compare-ci:/data/sessions -p 8000:8000 theme-compare:test
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health
          docker rm -f runtime-1
          docker run -d --name runtime-2 -e THEME_COMPARE_API_KEY=ci-secret -v theme-compare-ci:/data/sessions -p 8000:8000 theme-compare:test
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health
  openapi-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install pyyaml openapi-spec-validator
      - run: openapi-spec-validator openapi/custom-gpt-action.openapi.yaml
