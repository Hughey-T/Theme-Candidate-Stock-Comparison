name: Format OpenAPI fix

on:
  push:
    branches:
      - fix/custom-gpt-actions-openapi-importer
    paths:
      - .github/workflows/format-openapi-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/custom-gpt-actions-openapi-importer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.15.12
      - run: ruff format tests/test_openapi.py tools/generate_openapi.py
      - name: Commit formatting and remove temporary workflow
        run: |
          rm .github/workflows/format-openapi-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_openapi.py tools/generate_openapi.py .github/workflows/format-openapi-fix.yml
          git commit -m "Format OpenAPI importer compatibility code"
          git push origin HEAD:fix/custom-gpt-actions-openapi-importer
