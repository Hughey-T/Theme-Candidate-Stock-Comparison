name: Deploy production
run-name: ${{ inputs.orchestrator_correlation_id && format('orchestrator:{0}', inputs.orchestrator_correlation_id) || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      orchestrator_correlation_id:
        description: Opaque dispatch correlation generated by the Orchestrator
        required: true
        type: string
      commit_sha:
        description: Exact main commit to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: theme-compare-production
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: [self-hosted, Windows, X64, theme-production]
    timeout-minutes: 30
    steps:
      - name: Validate requested commit
        shell: powershell
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          if ($env:COMMIT_SHA -notmatch '^[0-9a-f]{40}$') {
            throw 'commit_sha must be a full lowercase Git SHA.'
          }

      - name: Check out the exact production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Require the current main commit
        shell: powershell
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          git fetch --no-tags origin main
          $mainSha = (git rev-parse origin/main).Trim()
          $headSha = (git rev-parse HEAD).Trim()
          if ($headSha -ne $env:COMMIT_SHA -or $mainSha -ne $env:COMMIT_SHA) {
            throw "Refusing deployment: requested=$env:COMMIT_SHA checked_out=$headSha current_main=$mainSha"
          }

      - name: Update production runtime
        shell: powershell
        run: .\deploy\update-production.ps1

      - name: Record deployment evidence
        if: success()
        shell: powershell
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8000/health' -TimeoutSec 10
          if ([string]$health.build_id -ne $env:COMMIT_SHA.Substring(0, 7)) {
            throw "Production build_id '$($health.build_id)' does not match requested commit."
          }
          "deployed_commit_sha=$env:COMMIT_SHA" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          "build_id=$($health.build_id)" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
