name: Format Phase 2

on:
  push:
    branches:
      - fix/phase2-comparability-contract

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase2-comparability-contract
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: PIP_CONSTRAINT=constraints-dev.txt python -m pip install -e '.[dev]'
      - run: ruff format src/theme_compare/phase2_contract.py tests/test_phase2_contract.py
      - run: ruff format --check src/theme_compare/phase2_contract.py tests/test_phase2_contract.py
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/theme_compare/phase2_contract.py tests/test_phase2_contract.py
          git commit -m "Apply Ruff formatting"
          git push origin HEAD:fix/phase2-comparability-contract
