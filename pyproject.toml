[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "theme-candidate-stock-comparison"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.21,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.15.12", "mypy>=1.10,<2", "types-jsonschema"]

[project.scripts]
theme-compare = "theme_compare.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/theme_compare"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true
